name: FitFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fitflow-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production static build
        run: npm run build

      - name: Verify static export
        run: node scripts/verify-static-export.mjs

      - name: Dependency audit
        run: |
          timeout 120s npm run audit || {
            echo "Initial dependency audit failed or timed out; retrying once in case the npm registry is transiently unavailable."
            sleep 20
            timeout 120s npm run audit
          }
