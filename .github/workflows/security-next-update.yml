name: Prepare Next.js security update

on:
  push:
    branches:
      - security/next-16.3.3

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/next-16.3.3

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate focused security lockfile
        run: npm install --package-lock-only --save-exact --ignore-scripts next@16.3.3 eslint-config-next@16.3.3

      - name: Install verified dependency graph
        run: npm ci

      - name: Verify project
        run: npm test

      - name: Commit verified package update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Upgrade Next.js to 16.3.3 security release"
          git push origin HEAD:security/next-16.3.3
